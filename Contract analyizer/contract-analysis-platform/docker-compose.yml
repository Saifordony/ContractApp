

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: contract_analysis_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - contract_analysis_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: contract_analysis_backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - SECRET_KEY=${SECRET_KEY:-fOKPSne8K-FKWqt4CvXUKwZSjzsNdL5WCHNrNpapjIw}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URL=mongodb://admin:admin123@mongodb:27017/contract_analysis?authSource=admin
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    networks:
      - contract_analysis_network

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: contract_analysis_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - API_BASE_URL=http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    networks:
      - contract_analysis_network

volumes:
  mongodb_data:

networks:
  contract_analysis_network:
    driver: bridge
