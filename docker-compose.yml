services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      MONGODB_URL: mongodb://admin:admin123@mongodb:27017/contract_analysis?authSource=admin
      MONGODB_DB: contract_analysis
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_MODE: ${AI_MODE:-simple}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.1}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-60}
      ANALYSIS_FAST_MODE: ${ANALYSIS_FAST_MODE:-true}
      ANALYSIS_JOB_TIMEOUT_SECONDS: ${ANALYSIS_JOB_TIMEOUT_SECONDS:-180}
      CORS_ORIGINS: http://localhost:8501
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PYTHONPATH: /app
      API_BASE_URL: http://backend:8000
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      FRONTEND_API_TIMEOUT_SECONDS: ${FRONTEND_API_TIMEOUT_SECONDS:-300}
    ports:
      - "8501:8501"
    volumes:
      - ./:/app

volumes:
  mongodb_data:
